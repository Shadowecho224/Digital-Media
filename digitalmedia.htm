<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Website</title>
    <style>
        /* 1. Reset Body Spacing */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 2. Header Box (Full Width) */
        #header-box {
            background-color: lightblue;
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 52px;
            font-family: courier, monospace;
            text-align: center;
            color: black;
            margin: 0;
        }

        /* 3. Navigation Bar */
        ul.nav-bar {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #333333;
            display: flex;
            justify-content: center;
        }

        ul.nav-bar li a {
            display: block;
            color: white;
            text-align: center;
            padding: 18px 24px;
            text-decoration: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        ul.nav-bar li a:hover {
            background-color: #111111;
        }

        /* 4. Panel Styles (Hidden by default) */
        .panel {
            display: none; /* Hide all panels initially */
            padding: 40px;
            text-align: center;
            background-color: #333333; 
            color: white;
            border-bottom: 5px solid #a6d8a8;
        }
        
        /* Containers for content outside the panels */
        .main-page-content {
            display: none;
            margin: 40px auto;
            width: 90%;
            max-width: 1200px;
            color: black;
        }

        .game-container {
            display: none;
            margin: 40px auto;
            max-width: 485px;
        }

        /* Dragon Table Styles */
        table, th, td {
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }

        /* Alignments and About Text List Formatting */
        .alignment-list {
            list-style-type: none;
            padding: 0;
        }
        .alignment-list dt {
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }
        .alignment-list dd {
            margin-left: 20px;
            margin-bottom: 15px;
            color: #333;
        }
    </style>

</head>
<body style="background-color:#F0F8FF;">
<div id="header-box">
    <h1>Welcome To My Website!<br>Bienvenue sur mon site Web!</h1>
</div>

<ul class="nav-bar">
    <li><a onclick="showPanel('me')">Get to Know Me</a></li>
    <li><a onclick="showPanel('dragons')">Dungeons and Dragons</a></li>
    <li><a onclick="showPanel('contact')">Contact</a></li>
    <li><a onclick="showPanel('about')">About</a></li>
    <li><a onclick="showPanel('games')">Games</a></li>
</ul>

<div id="me" class="panel">
    <h1 style="color:white">Dungeons and Dragons</h1>
    <p></p>
</div>


</body>
</html>
